<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Components Reference - Japan Tech</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    /* Temporary preview container for this reference page */
    body {
      background-color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 40px;
      display: flex;
      justify-content: center;
    }
  </style>
</head>
<body>

  <!-- Service Card Component -->
  <article class="service-card">
    <div class="service-card__icon-wrapper">
      <!-- Inline SVG replicating the exact phone line icon -->
      <svg class="service-card__icon" viewBox="0 0 48 48" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="12" y="4" width="24" height="40" rx="3" ry="3" />
        <line x1="21" y1="9" x2="27" y2="9" />
        <circle cx="24" cy="38" r="2" />
      </svg>
    </div>
    <h3 class="service-card__title">Smartphone Repair</h3>
    <p class="service-card__desc">
      Vivamus efficitur ac augue feugiat. Lorem ipsum dolor amet, consectetur fringilla adipiscing elit.
    </p>
  </article>

  <!-- Product Card Component -->
  <article class="product-card">
    <span class="product-card__badge">Hot</span>

    <div class="product-card__image-box">
      <!-- Replace src with your asset path later -->
      <img 
        src="https://images.unsplash.com/photo-1593642632823-8f785ba67e45?auto=format&fit=crop&w=600&q=80" 
        alt="High-Precision Wireless Mouse" 
        class="product-card__image"
      >
    </div>

    <div class="product-card__body">
      <span class="product-card__category">Accessories</span>
      <h4 class="product-card__title">
        <a href="shop.html">Logitech Precision Sensor Mouse</a>
      </h4>

      <div class="product-card__meta">
        <div class="product-card__price-wrap">
          <span class="product-card__price">$79.99</span>
          <span class="product-card__old-price">$99.99</span>
        </div>
        <div class="product-card__rating">
          <span class="product-card__rating-star">★</span>
          <span>4.8</span>
        </div>
      </div>

      <button type="button" class="product-card__btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        Add to Cart
      </button>
    </div>
  </article>

  <!-- Page Banner Component -->
<section class="page-banner">
  <div class="page-banner__container">
    <h1 class="page-banner__title">Repairs</h1>
    <nav class="page-banner__breadcrumbs" aria-label="Breadcrumb">
      <a href="index.html">Home</a>
      <span class="separator">/</span>
      <span class="current" aria-current="page">Repairs</span>
    </nav>
  </div>
</section>

<!-- Page Banner Component -->
<header class="section-heading">
  <h2 class="section-heading__title">Get Your Repair Started</h2>
  <span class="section-heading__divider"></span>
</header>

<!-- Contact Form Component -->
<form class="contact-form" action="#" method="POST" novalidate>
  
  <div class="form-group">
    <label for="name" class="form-label">Name <span class="required">*</span></label>
    <input 
      type="text" 
      id="name" 
      name="name" 
      class="form-input" 
      placeholder="Your name" 
      required
    >
  </div>

  <div class="form-group">
    <label for="email" class="form-label">Email <span class="required">*</span></label>
    <input 
      type="email" 
      id="email" 
      name="email" 
      class="form-input" 
      placeholder="Your e-mail" 
      required
    >
  </div>

  <div class="form-group form-group--textarea">
    <label for="message" class="form-label">Message <span class="required">*</span></label>
    <textarea 
      id="message" 
      name="message" 
      class="form-textarea" 
      placeholder="Your message" 
      rows="4" 
      required
    ></textarea>
  </div>

  <div class="form-actions">
    <button type="submit" class="form-submit-btn">Send Message</button>
  </div>

</form>

<!-- Pagination Component -->
<nav class="pagination" aria-label="Pagination Navigation">
  <ul class="pagination__list">
    
    <!-- Previous Button (Disabled on first page) -->
    <li class="pagination__item">
      <a href="#" class="pagination__link pagination__link--control" aria-disabled="true" tabindex="-1" aria-label="Previous page">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </a>
    </li>

    <!-- Page Numbers -->
    <li class="pagination__item">
      <a href="#" class="pagination__link pagination__link--active" aria-current="page">1</a>
    </li>

    <li class="pagination__item">
      <a href="#" class="pagination__link">2</a>
    </li>

    <li class="pagination__item">
      <a href="#" class="pagination__link">3</a>
    </li>

    <li class="pagination__item">
      <span class="pagination__ellipsis" aria-hidden="true">&hellip;</span>
    </li>

    <li class="pagination__item">
      <a href="#" class="pagination__link">10</a>
    </li>

    <!-- Next Button -->
    <li class="pagination__item">
      <a href="#" class="pagination__link pagination__link--control" aria-label="Next page">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </a>
    </li>

  </ul>
</nav>

</body>
</html>
